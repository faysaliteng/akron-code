<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quick Entry</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #30302e; color: #f5f4f0; display: flex; flex-direction: column; overflow: hidden; -webkit-app-region: drag; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; -webkit-app-region: drag; }
    .bar .logo { filter: drop-shadow(0 0 6px rgba(16,185,129,.35)); }
    .bar .label { font-size: 12px; color: #b8b5ae; font-weight: 600; }
    .bar .hint { margin-left: auto; font-size: 11px; color: #8d8a84; }
    textarea {
      -webkit-app-region: no-drag;
      flex: 1; margin: 0 14px 12px; padding: 10px 12px; resize: none; border: none; outline: none;
      border-radius: 10px; background: #3a3936; color: #f5f4f0; font-size: 14px; line-height: 1.45;
      font-family: inherit;
    }
    textarea::placeholder { color: #8d8a84; }
    .foot { display: flex; align-items: center; gap: 8px; padding: 0 14px 12px; -webkit-app-region: no-drag; }
    button {
      border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    button.primary { background: #10b981; color: #06211a; }
    button.ghost { background: transparent; color: #b8b5ae; }
    .foot .space { flex: 1; }
  </style>
</head>
<body>
  <div class="bar">
    <svg class="logo" width="14" height="14" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Akron Code"><g fill="#10B981"><circle cx="50" cy="50" r="17"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(0 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(45 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(90 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(135 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(180 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(225 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(270 50 50)"/><rect x="43.5" y="5" width="13" height="31" rx="6.5" transform="rotate(315 50 50)"/></g><circle cx="50" cy="50" r="7.5" fill="#A7F3D0" opacity="0.55"/></svg>
    <span class="label">Quick Entry</span>
    <span class="hint">⇧↩ to send</span>
  </div>
  <textarea id="q" placeholder="Ask Akron Code…" autofocus></textarea>
  <div class="foot">
    <button class="primary" id="send">Send</button>
    <button class="ghost" id="insert">Insert</button>
    <span class="space"></span>
    <button class="ghost" id="esc">Esc</button>
  </div>
  <script>
    const ta = document.getElementById('q');
    ta.focus();
    function submit(mode) {
      const text = ta.value.trim();
      if (!text) return;
      window.autobot.quickSubmit({ text, mode }).catch(() => {});
    }
    document.getElementById('send').onclick = () => submit('send');
    document.getElementById('insert').onclick = () => submit('insert');
    document.getElementById('esc').onclick = () => window.close();
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit('insert'); }
      else if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); submit('send'); }
      else if (e.key === 'Escape') { window.close(); }
    });
  </script>
</body>
</html>
