<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    
    <radialGradient id="hoodGrad" cx="42%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    
    <radialGradient id="faceScreen" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="68%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </radialGradient>

    
    <linearGradient id="crestGrad" x1="56" y1="10" x2="72" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    
    <filter id="faceShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022C22" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .agent-head {
      animation: floatBob 3.2s ease-in-out infinite;
      transform-origin: 64px 64px;
    }
    .agent-eyes {
      animation: eyeBlink 4.5s ease-in-out infinite;
      transform-origin: 64px 68px;
    }
    .crest-gem {
      animation: gemPulse 2.4s ease-in-out infinite;
      transform-origin: 64px 18px;
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.08); }
    }
    @keyframes gemPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }
  </style>

  <g class="agent-head" filter="url(#faceShadow)">
    
    <rect x="10" y="54" width="10" height="26" rx="5" fill="#059669" stroke="#047857" stroke-width="2" />
    <rect x="108" y="54" width="10" height="26" rx="5" fill="#059669" stroke="#047857" stroke-width="2" />

    
    <rect x="18" y="20" width="92" height="92" rx="44" fill="url(#hoodGrad)" stroke="#059669" stroke-width="2.5" />

    
    <path d="M42 29 C54 23, 74 23, 86 29" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    
    <path class="crest-gem" d="M64 11 L69 18 L64 25 L59 18 Z" fill="url(#crestGrad)" stroke="#ECFCCB" stroke-width="1.2" />

    
    <rect x="28" y="34" width="72" height="64" rx="30" fill="url(#faceScreen)" stroke="#059669" stroke-width="2" />
    <rect x="30" y="36" width="68" height="60" rx="28" stroke="#FFFFFF" stroke-width="1.5" opacity="0.65" />

    
    <ellipse cx="42" cy="76" rx="6.5" ry="3.8" fill="#34D399" opacity="0.5" />
    <ellipse cx="86" cy="76" rx="6.5" ry="3.8" fill="#34D399" opacity="0.5" />

    
    <g class="agent-eyes">
      
      <circle cx="48" cy="67" r="6" fill="#022C22" />
      <circle cx="46" cy="64.8" r="2" fill="#FFFFFF" />
      <circle cx="50" cy="69" r="0.9" fill="#A7F3D0" />

      
      <circle cx="80" cy="67" r="6" fill="#022C22" />
      <circle cx="78" cy="64.8" r="2" fill="#FFFFFF" />
      <circle cx="82" cy="69" r="0.9" fill="#A7F3D0" />
    </g>

    
    <path d="M58 75 Q64 81 70 75" stroke="#022C22" stroke-width="2.4" stroke-linecap="round" fill="none" />
  </g>
</svg>