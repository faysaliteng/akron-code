name: Build Akron Code Desktop (macOS · Windows · Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run brand:check
      - run: |
          failed=0
          for f in test/*.test.js; do
            echo "=== $f ==="
            if ! node "$f"; then
              echo "FAILED: $f"
              failed=$((failed + 1))
            fi
          done
          [ "$failed" -eq 0 ]
      - name: Verify zero source maps in dist/
        run: |
          MAPS=$(find dist -name '*.map' | wc -l)
          echo "Source maps found: $MAPS"
          [ "$MAPS" -eq 0 ]

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            cmd: npm run build && npx electron-builder --mac dmg zip -c.compression=normal --publish never
          - os: windows-latest
            platform: win
            cmd: npm run build && npx electron-builder --win -c.compression=normal --publish never
          - os: ubuntu-latest
            platform: linux
            cmd: npm run build && npx electron-builder --linux AppImage -c.compression=normal --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare vendor runtimes directory
        shell: bash
        run: |
          node -e "require('fs').mkdirSync('vendor/runtimes', { recursive: true })"
          node scripts/vendor-runtimes.js --download --stale || true
      - name: Package ${{ matrix.platform }} installer
        run: ${{ matrix.cmd }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify Electron Fuses, codesign & clean cold boot (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP_PATH="./release/mac-arm64/Akron Code.app"
          if [ ! -d "$APP_PATH" ]; then APP_PATH="./release/mac/Akron Code.app"; fi
          codesign --verify --deep --strict "$APP_PATH"
          APP_PATH="$APP_PATH" node -e "
          const { getCurrentFuseWire, FuseV1Options } = require('@electron/fuses');
          getCurrentFuseWire(process.env.APP_PATH).then(w => {
            const ok = w[FuseV1Options.RunAsNode]===48 && w[FuseV1Options.OnlyLoadAppFromAsar]===49 && w[FuseV1Options.EnableEmbeddedAsarIntegrityValidation]===49;
            console.log('MAC_FUSES_OK:', ok, w);
            if (!ok) process.exit(1);
          });
          "
          APP_PATH="$APP_PATH" node -e "
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const freshHome = fs.mkdtempSync(path.join(os.tmpdir(), 'akron-ci-boot-'));
          const exe = path.join(process.env.APP_PATH, 'Contents', 'MacOS', 'Akron Code');
          const res = spawnSync(exe, ['--disable-gpu'], {
            timeout: 30000,
            encoding: 'utf8',
            env: { ...process.env, HOME: freshHome, AKRON_COLD_BOOT_CHECK: '1', AKRON_NO_DIALOG: '1' }
          });
          console.log(res.stdout || '');
          if (res.stderr) console.error(res.stderr);
          fs.rmSync(freshHome, { recursive: true, force: true });
          if (res.status !== 0 || !(res.stdout || '').includes('COLD_BOOT_OK')) process.exit(1);
          "
      - name: Verify Electron Fuses (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $exe = if (Test-Path "./release/win-unpacked/Akron Code.exe") { "./release/win-unpacked/Akron Code.exe" } else { "./release/win-arm64-unpacked/Akron Code.exe" }
          $env:WIN_EXE = $exe
          node -e "
          const { getCurrentFuseWire, FuseV1Options } = require('@electron/fuses');
          getCurrentFuseWire(process.env.WIN_EXE).then(w => {
            const ok = w[FuseV1Options.RunAsNode]===48 && w[FuseV1Options.OnlyLoadAppFromAsar]===49 && w[FuseV1Options.EnableEmbeddedAsarIntegrityValidation]===49;
            console.log('WIN_FUSES_OK:', ok, w);
            if (!ok) process.exit(1);
          });
          "
      - uses: actions/upload-artifact@v4
        with:
          name: akron-code-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          ls -la
          sha256sum *.dmg *.zip *.exe *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
