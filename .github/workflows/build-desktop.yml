name: Build Akron Code Desktop (macOS · Windows · Linux)

on:
  push:
    branches: [main, master, fix/harness-swarm-pools]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          for f in test/*.test.js; do
            echo "=== $f ==="
            node "$f" || exit 1
          done
      - run: npm run build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            cmd: npm run build && npx electron-builder --mac dmg zip --publish never
          - os: windows-latest
            platform: win
            cmd: npm run build && npx electron-builder --win nsis portable --publish never
          - os: ubuntu-latest
            platform: linux
            cmd: npm run build && npx electron-builder --linux AppImage --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package ${{ matrix.platform }} installer
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: akron-code-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
