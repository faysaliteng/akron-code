name: Build Akron Code Desktop (macOS · Windows · Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run brand:check
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify zero source maps in dist/
        run: |
          MAPS=$(find dist -name '*.map' | wc -l | tr -d ' ')
          echo "Source maps found: $MAPS"
          [ "$MAPS" -eq 0 ]
      - run: npm test
      - run: npm run eval:all && node scripts/parity-audit.js && node test/cross-platform-audit.test.js

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            cmd: npm run build && npx electron-builder --mac dir --config.compression=normal --publish never && node scripts/inject-mac-ext-folder.js
          - os: windows-latest
            platform: win
            cmd: npm run build && npx electron-builder --win --config.compression=normal --publish never
          - os: ubuntu-latest
            platform: linux
            cmd: npm run build && npx electron-builder --linux AppImage tar.gz --config.compression=normal --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare vendor runtimes directory
        shell: bash
        run: |
          node -e "require('fs').mkdirSync('vendor/runtimes', { recursive: true })"
          node scripts/vendor-runtimes.js --download --stale || true
      - name: Package ${{ matrix.platform }} installer
        run: ${{ matrix.cmd }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify Electron Fuses, codesign & ASAR brand seal (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP_PATH="./release/mac-arm64/Akron Code.app"
          if [ ! -d "$APP_PATH" ]; then APP_PATH="./release/mac/Akron Code.app"; fi
          codesign --verify --deep --strict "$APP_PATH"
          APP_PATH="$APP_PATH" node -e "
          const { getCurrentFuseWire, FuseV1Options } = require('@electron/fuses');
          getCurrentFuseWire(process.env.APP_PATH).then(w => {
            const ok = w[FuseV1Options.RunAsNode]===48 && w[FuseV1Options.OnlyLoadAppFromAsar]===49 && w[FuseV1Options.EnableEmbeddedAsarIntegrityValidation]===49;
            console.log('MAC_FUSES_OK:', ok, w);
            if (!ok) process.exit(1);
          });
          "
          ASAR_TMP=$(mktemp -d)
          npx --yes @electron/asar extract "$APP_PATH/Contents/Resources/app.asar" "$ASAR_TMP"
          ASAR_TMP="$ASAR_TMP" RES_DIR="$APP_PATH/Contents/Resources" node -e "
          const r = require('./electron/brand-guard').verifyBrandIntegrity({
            appRoot: process.env.ASAR_TMP,
            resourcesPath: process.env.RES_DIR
          });
          console.log('MAC_ASAR_BRAND_OK:', r.ok, 'checkedFiles:', r.checkedFiles);
          if (!r.ok) { console.error(r.problems); process.exit(1); }
          "
          [ "$(find "$ASAR_TMP" -name '*.map' | wc -l | tr -d ' ')" -eq 0 ]
          rm -rf "$ASAR_TMP"
      - name: Verify Electron Fuses (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $exe = if (Test-Path "./release/win-unpacked/Akron Code.exe") { "./release/win-unpacked/Akron Code.exe" } else { "./release/win-arm64-unpacked/Akron Code.exe" }
          $env:WIN_EXE = $exe
          node -e "
          const { getCurrentFuseWire, FuseV1Options } = require('@electron/fuses');
          getCurrentFuseWire(process.env.WIN_EXE).then(w => {
            const ok = w[FuseV1Options.RunAsNode]===48 && w[FuseV1Options.OnlyLoadAppFromAsar]===49 && w[FuseV1Options.EnableEmbeddedAsarIntegrityValidation]===49;
            console.log('WIN_FUSES_OK:', ok, w);
            if (!ok) process.exit(1);
          });
          "
      - uses: actions/upload-artifact@v4
        with:
          name: akron-code-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.crx
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        shell: bash
        run: |
          shopt -s nullglob
          ls -la
          sha256sum *.dmg *.zip *.exe *.AppImage *.tar.gz *.crx > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/*.crx
            artifacts/latest*.yml
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
